<!DOCTYPE html>
<html>
<head>
	<title>SpotiStatus</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #121212;
			color: white;
			font-family: Arial, sans-serif;
		}

		.container {
			width: 420px;
			padding: 32px;
			background: #181818;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.4);
			text-align: center;
		}

		h1 {
			margin: 0 0 10px;
			font-size: 32px;
		}

		p {
			color: #b3b3b3;
			line-height: 1.5;
		}

		input {
			width: 100%;
			padding: 12px;
			margin-top: 10px;
			border-radius: 8px;
			border: 1px solid #333;
			background: #101010;
			color: #ddd;
			font-family: monospace;
		}

		button {
			margin-top: 15px;
			padding: 12px 24px;
			border: none;
			border-radius: 30px;
			background: #1db954;
			color: white;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover {
			background: #1ed760;
		}

		#token-step {
			margin-top: 25px;
			text-align: left;
		}

		#token {
			width: 100%;
			height: 100px;
			padding: 12px;
			resize: none;
			border-radius: 8px;
			border: 1px solid #333;
			background: #101010;
			color: #ddd;
			font-family: monospace;
			font-size: 12px;
		}

		.notice {
			margin-top: 20px;
			padding: 12px;
			background: #222;
			border-radius: 8px;
			font-size: 14px;
			color: #aaa;
		}

		.field {
			margin-top: 15px;
			text-align: left;
		}

		.field label {
			display: block;
			color: #ccc;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>SpotiStatus</h1>

		<p>
			Enter your Spotify Developer App credentials to connect Spotify.
		</p>

		<form action="/login" method="GET">

			<div class="field">
				<label>Client ID</label>
				<input
					type="text"
					name="client_id"
					required
					autocomplete="off"
				>
			</div>

			<div class="field">
				<label>Client Secret</label>
				<input
					type="password"
					name="client_secret"
					required
					autocomplete="off"
				>
			</div>

			<button type="submit">
				Connect Spotify
			</button>

		</form>

		<div id="token-step" style="display:none;">
			<p>Your WidgetStar settings:</p>

			<div class="field">
				<label>Spotify Token</label>
				<textarea id="token" readonly></textarea>
			</div>

			<div class="notice">
				Copy the token into your WidgetStar
				<b>spotifytoken</b> setting.

				<br><br>

				Also enter the same Spotify Developer
				<b>Client ID</b> and <b>Client Secret</b>
				into the corresponding WidgetStar settings.
			</div>
		</div>
	</div>

	<script>
		const params = new URLSearchParams(window.location.search);
		const token = params.get("token");

		if (token) {
			document.getElementById("token-step").style.display = "block";
			document.getElementById("token").value = token;
		}
	</script>
</body>
</html>
