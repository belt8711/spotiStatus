<!DOCTYPE html>
<html>
<head>
	<title>SpotiStatus</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #121212;
			color: white;
			font-family: Arial, sans-serif;
		}

		.container {
			width: 420px;
			padding: 32px;
			background: #181818;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.4);
			text-align: center;
		}

		h1 {
			margin: 0 0 10px;
			font-size: 32px;
		}

		p {
			color: #b3b3b3;
			line-height: 1.5;
		}

		button {
			margin-top: 15px;
			padding: 12px 24px;
			border: none;
			border-radius: 30px;
			background: #1db954;
			color: white;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.2s;
		}

		button:hover {
			background: #1ed760;
			transform: scale(1.03);
		}

		#token-step {
			margin-top: 25px;
			text-align: left;
		}

		#token {
			width: 100%;
			height: 100px;
			padding: 12px;
			resize: none;
			border-radius: 8px;
			border: 1px solid #333;
			background: #101010;
			color: #ddd;
			font-family: monospace;
			font-size: 12px;
		}

		.notice {
			margin-top: 20px;
			padding: 12px;
			background: #222;
			border-radius: 8px;
			font-size: 14px;
			color: #aaa;
		}

		#preview-step {
			margin-top: 25px;
			text-align: left;
		}

		.preview-box {
			margin-top: 15px;
			padding: 20px;
			background: #101010;
			border-radius: 12px;
			border: 1px solid #333;
		}

		.spotistatus-widget {
			text-align: center;
		}

		.spotistatus-album-art {
			width: 180px;
			height: 180px;
			object-fit: cover;
			border-radius: 12px;
			margin-bottom: 20px;
		}

		.spotistatus-widget table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
			text-align: left;
		}

		.spotistatus-widget th {
			background: #222;
			color: white;
			padding: 8px;
		}

		.spotistatus-widget td {
			background: #181818;
			color: #b3b3b3;
			padding: 8px;
			border-top: 1px solid #333;
			word-break: break-word;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>SpotiStatus</h1>

		<p>
			Connect your Spotify account to generate a widget token.
		</p>

		<a href="/login">
			<button>Connect Spotify</button>
		</a>

		<div id="token-step" style="display:none;">
			<p>Your refresh token:</p>

			<textarea id="token" readonly></textarea>

			<div class="notice">
				Copy this token into your WidgetStar <b>spotifytoken</b> setting.
			</div>
		</div>

		<div id="preview-step" style="display:none;">
			<p>Live widget preview:</p>

			<div class="preview-box">
				<div id="widget">
					<div class="spotistatus-widget">
						<img id="album-art" class="spotistatus-album-art" src="" alt="Album art">

						<table>
							<tr>
								<th>Variable</th>
								<th>Value</th>
							</tr>
							<tr>
								<td>song</td>
								<td id="song"></td>
							</tr>
							<tr>
								<td>artist</td>
								<td id="artist"></td>
							</tr>
							<tr>
								<td>album</td>
								<td id="album"></td>
							</tr>
							<tr>
								<td>songUrl</td>
								<td id="songUrl"></td>
							</tr>
							<tr>
								<td>artistUrl</td>
								<td id="artistUrl"></td>
							</tr>
							<tr>
								<td>albumUrl</td>
								<td id="albumUrl"></td>
							</tr>
							<tr>
								<td>img</td>
								<td id="img"></td>
							</tr>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		const params = new URLSearchParams(window.location.search);
		const token = params.get("token");

		if (token) {
			document.getElementById("token-step").style.display = "block";
			document.getElementById("preview-step").style.display = "block";
			document.getElementById("token").value = token;

			const script = document.createElement("script");
			script.src = "https://spotistatus.onrender.com/widget.js";

			script.dataset.settings = JSON.stringify({
				spotifytoken: token,
				custom_html: document.getElementById("widget").innerHTML,
				offline_html: document.getElementById("widget").innerHTML,
				offline_status: false
			});

			document.body.appendChild(script);
		}

		function updateWidget(data) {
			document.getElementById("song").textContent = data.song || "";
			document.getElementById("artist").textContent = data.artist || "";
			document.getElementById("album").textContent = data.album || "";
			document.getElementById("songUrl").textContent = data.songUrl || "";
			document.getElementById("artistUrl").textContent = data.artistUrl || "";
			document.getElementById("albumUrl").textContent = data.albumUrl || "";
			document.getElementById("img").textContent = data.img || "";
			document.getElementById("album-art").src = data.img || "";
		}
	</script>
</body>
</html>
