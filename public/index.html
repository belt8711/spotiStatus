<!DOCTYPE html>
<html>
<head>
	<title>SpotiStatus</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #121212;
			color: white;
			font-family: Arial, sans-serif;
		}

		.container {
			width: 420px;
			padding: 32px;
			background: #181818;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.4);
			text-align: center;
		}

		h1 {
			margin: 0 0 10px;
			font-size: 32px;
		}

		p {
			color: #b3b3b3;
			line-height: 1.5;
		}

		button {
			margin-top: 15px;
			padding: 12px 24px;
			border: none;
			border-radius: 30px;
			background: #1db954;
			color: white;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.2s;
		}

		button:hover {
			background: #1ed760;
			transform: scale(1.03);
		}

		#token-step {
			margin-top: 25px;
			text-align: left;
		}

		#token {
			width: 100%;
			height: 100px;
			padding: 12px;
			resize: none;
			border-radius: 8px;
			border: 1px solid #333;
			background: #101010;
			color: #ddd;
			font-family: monospace;
			font-size: 12px;
		}

		.notice {
			margin-top: 20px;
			padding: 12px;
			background: #222;
			border-radius: 8px;
			font-size: 14px;
			color: #aaa;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>SpotiStatus</h1>

		<p>
			Connect your Spotify account to generate a widget token.
		</p>

		<a href="/login">
			<button>Connect Spotify</button>
		</a>

		<div id="token-step" style="display:none;">
			<p>Your refresh token:</p>

			<textarea id="token" readonly></textarea>

			<div class="notice">
				Copy this token into your WidgetStar <b>spotifytoken</b> setting.
			</div>
		</div>
	</div>

	<script>
		const params = new URLSearchParams(window.location.search);
		const token = params.get("token");

		if (token) {
			document.getElementById("token-step").style.display = "block";
			document.getElementById("token").value = token;
		}
	</script>
</body>
</html>
